[package]
name = "constraint-macros"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
quote = "1.0.33"
syn = { version = "2.0.39", features = ["full"] }
winterfell = "0.7.1"
trace-defs = { path = "../trace-defs" }
proc-macro2 = "1.0.70"

[lib]
proc-macro = true
