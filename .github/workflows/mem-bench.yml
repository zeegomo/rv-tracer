name: Memory Bench

on: [workflow_call]

jobs:
  bench-reference-mem:
    name: Benchmark fibonacci 1000 reference
    runs-on: [alpha]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run bench exec
        id: run_exec
        run: cargo bench --bench fib_exec >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: fib-exec
          path: tracer/dhat-heap.json
      - name: Run bench prove
        id: run_prove
        run: cargo bench --bench fib_prove >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: fib-prove
          path: tracer/dhat-heap.json
      - name: Run bench verify
        id: run_verify
        run: cargo bench --bench fib_verify >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: fib-verify
          path: tracer/dhat-heap.json

  bench-segmented-mem:
    name: Benchmark fibonacci 1000 segmented
    runs-on: [alpha]
    strategy:
      matrix:
        segment_len: [2048]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run bench prove segmented
        run: cargo bench --bench fib_prove_segmented -- --segment-len ${{ matrix.segment_len }}  >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: fib-prove-segmented-${{ matrix.segment_len }}
          path: tracer/dhat-heap.json
      - name: Run bench verify segmented
        run: cargo bench --bench fib_verify_segmented -- --segment-len ${{ matrix.segment_len }} >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: fib-verify-segmented-${{ matrix.segment_len }}
          path: tracer/dhat-heap.json

  write_report:
    runs-on: [alpha]
    name: Write report
    needs: [bench-segmented-mem, bench-reference-mem]
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            let prove = join(needs.bench-segmented-men.outputs, '\t');
            let verify = join(needs.bench-segmented-men.outputs, '\t');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "**Fib 1000 peak memory usage segmented (4K)**:\n * prove: " + prove + " kB\n * verify: " + verify + " kB"
            })
      - uses: actions/github-script@v6
        with:
          script: |
            let exec = ${{ needs.bench-reference-mem.steps.run_exec.outputs.out }}[3] / 1024;
            let prove =  ${{ needs.bench-reference-mem.steps.run_prove.outputs.out }}[3] / 1024;
            let verify = ${{ needs.bench-reference-mem.steps.run_verify.outputs.out }}[3] / 1024;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "**Fib 1000 peak memory usage**:\n * exec: " + exec + " kB\n * prove: " + prove + " kB\n * verify: " + verify + " kB"
            })
